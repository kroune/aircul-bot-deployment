apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: central-ingress
  namespace: aircul-bot
spec:
  ingressClassName: nginx
  rules:
    # Webhook Telegram регистрируется на https://admin.root-day.cu3rd.ru/tg/webhook
    - host: admin.root-day.cu3rd.ru
      http:
        paths:
          # Публичный контур: только webhook Telegram и healthcheck'и.
          - path: /tg/webhook
            pathType: Exact
            backend:
              service:
                name: central-public
                port: { number: 8080 }
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: central-public
                port: { number: 8080 }
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: central-public
                port: { number: 8080 }
          # Всё остальное — admin API (Basic Auth на стороне приложения).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: central-admin
                port: { number: 8081 }
