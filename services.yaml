apiVersion: v1
kind: Service
metadata:
  name: central-public
  namespace: aircul-bot
spec:
  selector:
    app: central
  ports:
    - { name: http, port: 8080, targetPort: public }
---
apiVersion: v1
kind: Service
metadata:
  name: central-admin
  namespace: aircul-bot
spec:
  selector:
    app: central
  ports:
    - { name: http, port: 8081, targetPort: admin }
