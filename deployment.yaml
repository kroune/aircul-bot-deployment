apiVersion: apps/v1
kind: Deployment
metadata:
  name: central
  namespace: aircul-bot
  labels:
    app: central
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central
  template:
    metadata:
      labels:
        app: central
      annotations:
        # prometheus собирает /metrics с admin-listener'а (basic_auth — общий
        # grafana-scraper из prometheus server-config, креды совпадают с секретом)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
    spec:
      # Секрет для pull приватного пакета GHCR:
      #   kubectl -n aircul-bot create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT read:packages>
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: central
          image: ghcr.io/cu-3rd-party/aircul-bot:main
          imagePullPolicy: Always
          env:
            - name: CONFIG_PATH
              value: /etc/central/config.yaml
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef: { name: central-secrets, key: TELEGRAM_TOKEN }
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: central-secrets, key: TELEGRAM_WEBHOOK_SECRET }
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: central-secrets, key: OPENROUTER_API_KEY }
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef: { name: central-secrets, key: ADMIN_USER }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: central-secrets, key: ADMIN_PASSWORD }
            # Managed PostgreSQL (внешний; бэкапы на стороне провайдера).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: central-secrets, key: DATABASE_URL }
          ports:
            - { name: public, containerPort: 8080 }
            - { name: admin, containerPort: 8081 }
          volumeMounts:
            - { name: config, mountPath: /etc/central, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: public }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: public }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1.5", memory: 2Gi }
      volumes:
        - name: config
          configMap:
            name: central-config
